    <script>
      // This function forces the form to send data even if React blocks it
      function enableWeb3Forms() {
        const form = document.querySelector('form');
        if (form) {
          form.onsubmit = async (e) => {
            e.preventDefault(); // Stop React's default behavior
            
            const formData = new FormData(form);
            formData.append("access_key", "96a85d2d-8127-47d2-ab14-c60c00da5801");

            const response = await fetch("https://api.web3forms.com/submit", {
              method: "POST",
              body: formData
            });

            if (response.ok) {
              alert("Message sent successfully! Dr. Abdullah will contact you soon.");
              form.reset();
            } else {
              alert("Error sending message. Please try again.");
            }
          };
        }
      }

      // Check for the form every second until it appears
      const checker = setInterval(() => {
        if (document.querySelector('form')) {
          enableWeb3Forms();
          clearInterval(checker);
        }
      }, 1000);
    </script>
